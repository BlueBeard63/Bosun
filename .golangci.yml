# golangci-lint v2 configuration, shared by the root module and every nested
# module (golangci-lint looks for this file in parent directories). CI pins the
# golangci-lint version in .github/workflows/ci.yml; run the same version
# locally:
#
#   go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
version: "2"

run:
  timeout: 10m

linters:
  # An explicit, deliberately small set: correctness checks plus a spell
  # check. Style linters are left out on purpose.
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        # Best-effort writes to an http.ResponseWriter or a CLI's output:
        # there is nobody left to report the error to.
        - (net/http.ResponseWriter).Write
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
    # misspell runs with its default word list and no locale, so British
    # spellings (cancelled, behaviour) are fine.
    staticcheck:
      checks:
        # golangci-lint's defaults...
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # ...minus refactoring suggestions: quickfixes (QF*) and S1016
        # (struct conversion instead of a literal), which would couple the
        # examples' DTOs to their models.
        - -QF*
        - -S1016
  exclusions:
    generated: lax
    presets:
      # Unchecked Close/Flush/os.Remove and similar idioms.
      - std-error-handling
      - common-false-positives
    rules:
      # Tests may ignore errors from setup and cleanup calls.
      - path: _test\.go
        linters: [errcheck]
    paths:
      - testdata

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - testdata
