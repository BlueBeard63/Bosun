<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bosun docs</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#index" aria-label="Bosun docs home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
          <rect width="24" height="24" rx="6" fill="currentColor"/>
          <path d="M12 6.2a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm0 3.6v8.4m0 0c-2.5 0-4.4-1.9-4.6-4.3m4.6 4.3c2.5 0 4.4-1.9 4.6-4.3M8 12.2H16M6.6 13.7l.8-.2M17.4 13.7l-.8-.2" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand-name">Bosun</span>
      <span id="version" class="version" hidden></span>
    </a>
    <div class="spacer"></div>
    <button id="searchBtn" class="searchbtn" type="button" aria-label="Search the docs">
      <svg class="icon" viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/>
        <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span class="searchbtn-label">Search the docs</span>
      <span class="kbd" id="searchKbd">Ctrl K</span>
    </button>
    <button id="themeBtn" class="iconbtn" type="button" aria-label="Toggle theme" title="Toggle theme"></button>
    <a class="iconbtn" href="https://github.com/amberstack/bosun" target="_blank" rel="noopener" aria-label="GitHub">
      <svg viewBox="0 0 20 20" width="20" height="20" fill="currentColor" aria-hidden="true">
        <path d="M10 .3a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48l-.01-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.36 1.09 2.94.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85l-.01 2.75c0 .27.18.58.69.48A10 10 0 0 0 10 .3Z"/>
      </svg>
    </a>
  </header>

  <div class="layout">
    <nav id="nav" class="sidebar" aria-label="Documentation navigation"></nav>
    <main class="content">
      <article id="article" class="article"><p class="loading">Loading…</p></article>
      <nav id="prevnext" class="prevnext" aria-label="Previous and next page"></nav>
    </main>
    <aside id="toc" class="onthispage" aria-label="On this page"></aside>
  </div>

  <div id="palette" class="palette" hidden>
    <div class="palette-backdrop" data-close></div>
    <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search">
      <div class="palette-input">
        <svg class="icon" viewBox="0 0 16 16" width="18" height="18" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <input id="pq" type="text" placeholder="Search the docs" autocomplete="off" spellcheck="false">
        <span class="kbd" data-close>Esc</span>
      </div>
      <div id="presults" class="palette-results"></div>
      <div class="palette-foot">
        <span><span class="kbd">↑</span><span class="kbd">↓</span> navigate</span>
        <span><span class="kbd">↵</span> select</span>
        <span><span class="kbd">esc</span> close</span>
      </div>
    </div>
  </div>

  <script src="/assets/app.js"></script>
</body>
</html>
