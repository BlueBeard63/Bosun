<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bosun docs</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#index" aria-label="Bosun docs home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 28 28" width="26" height="26">
          <rect width="28" height="28" rx="7" fill="currentColor"/>
          <g transform="translate(4 4)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="4.2" r="2.2"/>
            <line x1="10" x2="10" y1="18.4" y2="6.4"/>
            <path d="M4.4 10.4H2a8 8 0 0 0 16 0h-2.4"/>
          </g>
        </svg>
      </span>
      <span class="brand-name">Bosun</span>
      <span id="version" class="version" hidden></span>
    </a>
    <div class="spacer"></div>
    <button id="searchBtn" class="searchbtn" type="button" aria-label="Search the docs">
      <svg class="icon lucide" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <span class="searchbtn-label">Search the docs</span>
      <span class="kbd" id="searchKbd">Ctrl K</span>
    </button>
    <button id="themeBtn" class="iconbtn" type="button" aria-label="Toggle theme" title="Toggle theme"></button>
    <a class="iconbtn" href="https://github.com/amberstack/bosun" target="_blank" rel="noopener" aria-label="GitHub">
      <svg class="lucide" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 1 5 1 5 1c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 8c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
        <path d="M9 18c-4.51 2-5-2-7-2"/>
      </svg>
    </a>
  </header>

  <div class="layout">
    <nav id="nav" class="sidebar" aria-label="Documentation navigation"></nav>
    <main class="content">
      <article id="article" class="article"><p class="loading">Loading...</p></article>
      <nav id="prevnext" class="prevnext" aria-label="Previous and next page"></nav>
    </main>
    <aside id="toc" class="onthispage" aria-label="On this page"></aside>
  </div>

  <div id="palette" class="palette" hidden>
    <div class="palette-backdrop" data-close></div>
    <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search">
      <div class="palette-input">
        <svg class="icon lucide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="pq" type="text" placeholder="Search the docs" autocomplete="off" spellcheck="false">
        <span class="kbd" data-close>Esc</span>
      </div>
      <div id="presults" class="palette-results"></div>
      <div class="palette-foot">
        <span>
          <span class="kbd"><svg class="lucide" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></span>
          <span class="kbd"><svg class="lucide" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg></span>
          navigate
        </span>
        <span>
          <span class="kbd"><svg class="lucide" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4v7a4 4 0 0 1-4 4H4"/><path d="m9 10-5 5 5 5"/></svg></span>
          select
        </span>
        <span><span class="kbd">esc</span> close</span>
      </div>
    </div>
  </div>

  <script src="/assets/app.js"></script>
</body>
</html>
