<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Bosun</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b7bff"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <g transform="translate(-1 2)">
    <!-- bosun's call: the gun (pipe) and keel (plate) form one wedge, like a hull -->
    <path fill="#fff" d="M8 20.5 C21 20 31 24 40 30 L44 46 C32 44 19 37 9.5 27.5 C7.5 25.5 6.5 21 8 20.5 Z"/>
    <!-- seam between the gun above and the keel below -->
    <path d="M13 25.6 C22 27 31 30.5 37.5 35" fill="none" stroke="#2a5ae6" stroke-width="1.8" stroke-linecap="round"/>
    <!-- the buoy (bowl) and its sound hole -->
    <circle cx="44" cy="38" r="10.5" fill="#fff"/>
    <circle cx="46.5" cy="34.5" r="3.4" fill="#1e40af"/>

    <!-- the call: waves rising from the sound hole -->
    <g fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round">
      <path d="M46 22.5 a12 12 0 0 1 12.5 10"/>
      <path d="M46.5 14.5 a20 20 0 0 1 14 9" opacity="0.55"/>
    </g>
  </g>
</svg>
