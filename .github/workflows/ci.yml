name: CI

on:
  pull_request:
    branches: [master, "v*"]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Every module except the root, in dependency order. Keep in sync with
  # scripts/release.sh.
  NESTED_MODULES: >-
    cmd/bosun
    modules/eventamqpmod
    modules/eventnatsmod
    modules/eventredismod
    modules/stores3mod
    modules/traceotelmod

jobs:
  root:
    name: Root module (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.22.x is the minimum in go.mod; stable catches new vet/toolchain issues.
        go: ["1.22.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  checks:
    name: Formatting, tidiness and generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '/testdata/'))
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: |
          status=0
          for m in . $NESTED_MODULES; do
            if ! (cd "$m" && GOWORK=off go mod tidy -diff); then
              echo "::error file=$m/go.mod::go.mod/go.sum not tidy; run (cd $m && go mod tidy)"
              status=1
            fi
          done
          exit $status
      - name: Docs site is regenerated
        run: |
          (cd cmd/bosun && go generate .)
          if [ -n "$(git status --porcelain -- cmd/bosun/internal/docsite/content)" ]; then
            echo "::error::docs/ changed without regenerating the docsite; run (cd cmd/bosun && go generate .)"
            git status --short -- cmd/bosun/internal/docsite/content
            exit 1
          fi

  nested:
    name: ${{ matrix.module }} (against this PR's bosun)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cmd/bosun
          - modules/eventamqpmod
          - modules/eventnatsmod
          - modules/eventredismod
          - modules/stores3mod
          - modules/traceotelmod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      # Nested modules require the *published* bosun; a workspace points them at
      # the checked-out root instead, so a PR that breaks them fails here rather
      # than after release.
      - name: Create workspace
        run: go work init . $NESTED_MODULES
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

  integration:
    name: Broker and storage integration
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 20
      nats:
        image: nats:2
        ports: ["4222:4222"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOSUN_AMQP_URL: amqp://guest:guest@localhost:5672/
      BOSUN_NATS_URL: nats://localhost:4222
      BOSUN_REDIS_ADDR: localhost:6379
      BOSUN_S3_ENDPOINT: localhost:9000
      BOSUN_S3_KEY: minioadmin
      BOSUN_S3_SECRET: minioadmin
      BOSUN_S3_BUCKET: bosun-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      # Service containers can't take a command, and MinIO needs `server /data`.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$BOSUN_S3_KEY" -e MINIO_ROOT_PASSWORD="$BOSUN_S3_SECRET" \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -fs http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1
      - name: Create workspace
        run: go work init . $NESTED_MODULES
      - name: Test with live services
        run: |
          for m in modules/eventamqpmod modules/eventnatsmod modules/eventredismod modules/stores3mod; do
            echo "::group::$m"
            (cd "$m" && go test -race -count=1 -v ./...) || { echo "::endgroup::"; exit 1; }
            echo "::endgroup::"
          done
